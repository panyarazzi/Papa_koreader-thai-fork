name: android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - work/epub-compat-altbar-sarabun-ui

defaults:
  run:
    shell: bash

jobs:
  android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          show-progress: false

      - name: Checkout Simple UI plugin
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 plugins/simpleui.koplugin
          test -f plugins/simpleui.koplugin/main.lua
          test -f plugins/simpleui.koplugin/_meta.lua

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm Java runtime
        run: |
          java -version
          test "$(java -XshowSettings:properties -version 2>&1 | awk '/java.specification.version =/ {print $3; exit}')" = "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            cmake \
            gcc-multilib \
            gettext \
            git \
            libtool \
            libtool-bin \
            meson \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            p7zip-full \
            patch \
            pkg-config \
            unzip \
            wget

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch thirdparty
        run: make TARGET= fetchthirdparty

      - name: Patch libdatrie Android configure probe
        run: |
          sed -i \
            's/ac_cv_func_iconv_open=yes/ac_cv_func_iconv_open=yes datrie_cv_langinfo_codeset=yes/' \
            base/thirdparty/libdatrie/CMakeLists.txt

      - name: Build Android ARM64 APK
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          ./kodev release android-arm64

      - name: Sign APK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner Android SDK is not configured}"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "${build_tools}/zipalign"
          test -x "${build_tools}/apksigner"
          unsigned_apk="$(find . -maxdepth 1 -name 'koreader-android-arm64-*.apk' -print -quit)"
          test -n "${unsigned_apk}"
          sanitized_apk="${RUNNER_TEMP}/koreader-thai-unsigned-sanitized.apk"
          cp "${unsigned_apk}" "${sanitized_apk}"
          zip -d "${sanitized_apk}" \
            'META-INF/com/android/build/gradle/app-metadata.properties' \
            'META-INF/version-control-info.textproto' \
            'META-INF/*.kotlin_module' || true
          keytool -genkeypair \
            -keystore "${RUNNER_TEMP}/koreader-thai-debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "${build_tools}/zipalign" -f -p 4 "${sanitized_apk}" "${RUNNER_TEMP}/koreader-thai-aligned.apk"
          "${build_tools}/apksigner" sign \
            --ks "${RUNNER_TEMP}/koreader-thai-debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out koreader-thai-android-arm64.apk \
            "${RUNNER_TEMP}/koreader-thai-aligned.apk"
          "${build_tools}/apksigner" verify --verbose --print-certs koreader-thai-android-arm64.apk

      - name: Verify APK package and checksum
        run: |
          set -euo pipefail
          test -s koreader-thai-android-arm64.apk
          unzip -l koreader-thai-android-arm64.apk | tee "${RUNNER_TEMP}/apk-contents.txt"
          grep -q 'lib/arm64-v8a/' "${RUNNER_TEMP}/apk-contents.txt"

          # KOReader's Lua application is stored in a nested 7z asset, not as
          # loose files in the outer APK ZIP. Inspect that archive directly.
          nested_archive="${RUNNER_TEMP}/koreader.7z"
          unzip -p koreader-thai-android-arm64.apk assets/module/koreader.7z > "${nested_archive}"
          test -s "${nested_archive}"
          7z l -slt "${nested_archive}" > "${RUNNER_TEMP}/koreader-contents.txt"
          grep -Fq 'Path = plugins/simpleui.koplugin/main.lua' "${RUNNER_TEMP}/koreader-contents.txt"
          grep -Fq 'Path = plugins/simpleui.koplugin/_meta.lua' "${RUNNER_TEMP}/koreader-contents.txt"

          sha256sum koreader-thai-android-arm64.apk

      - name: List APKs
        run: ls -lh koreader-thai-android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: koreader-thai-android-arm64-apk
          path: koreader-thai-android-arm64.apk
